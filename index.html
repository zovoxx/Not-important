<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04050a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Surge">
<meta name="description" content="Neon Surge - a fast neon arena survival shooter for your phone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Neon Surge</title>
<style>
  :root {
    --font: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Roboto Mono", "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace;
    --cyan: #33f6ff;
    --magenta: #ff3df2;
    --bg: #04050a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--bg); color: #e8fbff;
    font-family: var(--font);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-text-size-adjust: none;
  }
  body { position: fixed; inset: 0; }
  canvas#game { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safeProbe { position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: min(2.2vh, 14px);
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at center, rgba(10,14,40,0.82) 0%, rgba(2,3,8,0.94) 75%);
    z-index: 10; text-align: center; touch-action: none;
  }
  .hidden { display: none !important; }

  .title {
    margin: 0; font-size: min(13vw, 15vh, 88px); font-weight: 900; letter-spacing: 0.08em;
    color: #eaffff; line-height: 1;
    text-shadow: 0 0 6px var(--cyan), 0 0 18px var(--cyan), 0 0 36px var(--magenta);
    animation: titleGlow 2.4s ease-in-out infinite;
  }
  .title span { color: #ffe9fe; text-shadow: 0 0 6px var(--magenta), 0 0 18px var(--magenta), 0 0 36px var(--cyan); }
  @keyframes titleGlow {
    0%, 100% { filter: brightness(1); transform: scale(1); }
    50% { filter: brightness(1.35); transform: scale(1.025); }
  }
  .sub { margin: 0; font-size: min(3.4vw, 4vh, 15px); color: #8fd9ff; opacity: 0.85; max-width: 92vw; }
  h2 { margin: 0; font-size: min(8vw, 10vh, 52px); letter-spacing: 0.1em; }
  h2.neon { color: #fff; text-shadow: 0 0 8px var(--cyan), 0 0 22px var(--cyan); }
  h2.danger { color: #fff; text-shadow: 0 0 8px #ff3355, 0 0 24px #ff3355; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .btn {
    min-width: 52px; min-height: 52px; padding: 0 18px;
    font-family: var(--font); font-size: 15px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--cyan); background: rgba(10, 30, 50, 0.55);
    border: 2px solid var(--cyan); border-radius: 12px;
    box-shadow: 0 0 10px rgba(51,246,255,0.45), inset 0 0 10px rgba(51,246,255,0.18);
    cursor: pointer; touch-action: manipulation;
  }
  .btn:active { transform: scale(0.96); background: rgba(51,246,255,0.18); }
  .btn.big {
    min-height: 64px; min-width: 260px; font-size: 22px; color: #fff;
    border-color: var(--magenta);
    box-shadow: 0 0 14px rgba(255,61,242,0.6), inset 0 0 14px rgba(255,61,242,0.25);
    text-shadow: 0 0 8px var(--magenta);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 26px rgba(255,61,242,0.9), inset 0 0 18px rgba(255,61,242,0.35); } }
  .btn.off { color: #55707a; border-color: #34505a; box-shadow: none; text-decoration: line-through; }

  #pauseBtn {
    position: fixed; z-index: 5; top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right));
    width: 52px; height: 52px; padding: 0; font-size: 18px; border-radius: 12px;
    opacity: 0.75;
  }

  /* level-up cards */
  #cards { display: flex; gap: min(2.5vw, 18px); justify-content: center; align-items: stretch; width: 100%; max-width: 900px; }
  .card {
    flex: 1 1 0; max-width: 270px; min-height: min(52vh, 250px);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px;
    padding: 12px 10px; border-radius: 16px; cursor: pointer;
    background: linear-gradient(180deg, rgba(20,30,70,0.85), rgba(8,10,25,0.92));
    border: 2px solid var(--c, var(--cyan));
    box-shadow: 0 0 14px color-mix(in srgb, var(--c, #33f6ff) 60%, transparent), inset 0 0 18px color-mix(in srgb, var(--c, #33f6ff) 20%, transparent);
    color: #fff; font-family: var(--font); touch-action: manipulation;
    animation: cardIn 0.28s cubic-bezier(.2,1.4,.4,1) both;
  }
  .card:nth-child(2) { animation-delay: 0.06s; }
  .card:nth-child(3) { animation-delay: 0.12s; }
  @keyframes cardIn { from { transform: translateY(30px) scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .card:active { transform: scale(0.96); }
  .card canvas { width: min(17vh, 84px); height: min(17vh, 84px); }
  .card .name { font-size: min(4.2vh, 17px); font-weight: 800; color: var(--c, var(--cyan)); text-shadow: 0 0 8px var(--c, var(--cyan)); }
  .card .lvl { font-size: 12px; color: #9ab; letter-spacing: 0.1em; }
  .card .desc { font-size: min(3.6vh, 13px); color: #cfe9ff; line-height: 1.3; }

  .stats { display: grid; grid-template-columns: auto auto auto auto; gap: 2px 18px; font-size: min(4.4vh, 17px); text-align: left; }
  .stats b { color: var(--cyan); text-align: right; }
  .stats .best b { color: #ffe23a; }
  .newbest { color: #ffe23a; text-shadow: 0 0 10px #ffe23a; font-weight: 800; font-size: min(4.5vh, 18px); }

  #rotate { z-index: 50; background: #04050a; }
  #rotate .phone {
    width: 46px; height: 80px; border: 3px solid var(--cyan); border-radius: 9px;
    box-shadow: 0 0 14px var(--cyan); animation: rot 1.8s ease-in-out infinite;
  }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safeProbe"></div>

<button id="pauseBtn" class="btn hidden" aria-label="Pause">II</button>

<div id="startScreen" class="screen">
  <h1 class="title">NEON <span>SURGE</span></h1>
  <p class="sub">Left thumb: move &middot; double-tap left: dash &middot; right thumb: aim &amp; fire</p>
  <button id="startBtn" class="btn big">TAP TO START</button>
  <div class="row">
    <button id="fsBtn" class="btn">FULLSCREEN</button>
    <button class="btn tgl" data-key="music">MUSIC</button>
    <button class="btn tgl" data-key="sfx">SFX</button>
    <button class="btn tgl" data-key="vibe">VIBE</button>
  </div>
  <p class="sub">Laptop: WASD move &middot; mouse aim &middot; hold click to fire &middot; SPACE dash &middot; P pause</p>
</div>

<div id="pauseScreen" class="screen hidden">
  <h2 class="neon">PAUSED</h2>
  <button id="resumeBtn" class="btn big">RESUME</button>
  <div class="row">
    <button class="btn tgl" data-key="music">MUSIC</button>
    <button class="btn tgl" data-key="sfx">SFX</button>
    <button class="btn tgl" data-key="vibe">VIBE</button>
    <button id="quitBtn" class="btn">QUIT RUN</button>
  </div>
</div>

<div id="levelScreen" class="screen hidden">
  <h2 class="neon" id="levelTitle">LEVEL UP</h2>
  <div id="cards"></div>
</div>

<div id="overScreen" class="screen hidden">
  <h2 class="danger">SIGNAL LOST</h2>
  <div id="newBest" class="newbest hidden">NEW SESSION BEST!</div>
  <div class="stats" id="stats"></div>
  <div class="row"><button id="againBtn" class="btn big">PLAY AGAIN</button><button id="menuBtn" class="btn">MENU</button></div>
</div>

<div id="rotate" class="screen hidden">
  <div class="phone"></div>
  <h2 class="neon" style="font-size:22px">Please rotate your phone</h2>
  <p class="sub">Neon Surge is played in landscape</p>
</div>

<script>
'use strict';
/* =====================================================================
   NEON SURGE
   Single-file neon arena survival shooter. Canvas 2D + Web Audio only.

   Sections:
     1. CONFIG        - every balance number lives here
     2. UTILITIES     - math helpers, pools, spatial grid
     3. SETTINGS      - session toggles (music / sfx / vibration)
     4. AUDIO         - procedural SFX + scheduled synthwave music
     5. INPUT         - twin floating joysticks, keyboard + mouse
     6. RENDER SETUP  - canvas sizing, DPR, cached glow sprites
     7. GAME STATE    - player, pools of entities
     8. EFFECTS       - particles, floating text, shake
     9. COMBAT        - bullets, damage, kills, pickups
    10. ENEMIES       - spawn + per-type behavior, bosses
    11. UPGRADES      - definitions, stacking, card choice
    12. DIRECTOR      - difficulty ramp, waves, boss timing
    13. RENDERING     - world + HUD drawing
    14. UI            - DOM screens
    15. GAME LOOP
   ===================================================================== */

/* =====================================================================
   1. CONFIG — tweak balance here
   ===================================================================== */
const CONFIG = {
  // Logical view: the world is scaled so ~720 units are always visible vertically
  // (and at most 1500 horizontally), so every screen sees about the same arena area.
  view: { height: 720, maxWidth: 1500 },
  arena: { w: 2600, h: 1700 },
  camera: { follow: 7.5 },          // higher = snappier camera
  maxDt: 1 / 30,                     // delta time clamp (s) so lag spikes stay stable

  player: {
    maxHp: 100,
    speed: 290,                      // units / s
    accel: 14,                       // velocity smoothing
    radius: 14,                      // visual radius
    hitRadius: 8,                    // forgiving hitbox
    invuln: 0.9,                     // seconds of invulnerability after a hit
    fireRate: 6.5,                   // shots / s
    bulletSpeed: 920,
    bulletDamage: 10,
    bulletLife: 0.85,
    bulletRadius: 5,
    spread: 0.15,                    // radians between multishot bullets
    pickupRadius: 110,               // XP orb attraction radius
    dashDistance: 175,
    dashTime: 0.13,
    dashCooldown: 1.6,
    doubleTapMs: 300,
  },

  xp: {
    // xp needed to go from level L to L+1
    need: (L) => Math.round(5 + (L - 1) * 4 + Math.pow(L - 1, 1.6) * 1.2),
    orbCap: 350,
    orbSpeed: 620,
  },

  combo: { window: 2.0, killsPerStep: 4, max: 10 },

  pickups: {
    dropChance: 0.022,               // per normal kill
    weights: { health: 3, shield: 2, bomb: 1.4, magnet: 2.4 },
    healthAmount: 30,
    shieldTime: 5,
    life: 14,                        // seconds before a pickup fades
  },

  director: {
    openingBurst: 9,                 // chasers spawned immediately at start
    spawnRateStart: 2.2,             // enemies / s at t=0
    spawnRateGrowth: 0.042,          // + per second survived
    spawnRateMax: 13,
    hpGrowthPerMin: 0.55,            // enemy hp multiplier increase per minute
    speedGrowthPerMin: 0.09,
    speedMaxMul: 1.5,
    waveEvery: 20,                   // seconds between "surround" waves
    bossEvery: 90,
    bossWarning: 3.5,
    bossSpawnMul: 0.3,               // normal spawns during a boss fight
    postBossBonus: 0.15,             // extra spawn-rate mult per boss defeated
    maxEnemies: 230,
    rampWindow: 25,                  // seconds for a new enemy type to reach full weight
  },

  // type: hp, speed, radius, contact damage, xp value, score, color, unlock time (s), spawn weight
  enemies: {
    chaser:     { hp: 10, speed: 125, r: 13, dmg: 10, xp: 1, score: 10, color: '#ff3355', unlock: 0,   weight: 10 },
    swarm:      { hp: 3,  speed: 165, r: 6,  dmg: 5,  xp: 1, score: 4,  color: '#33f6ff', unlock: 7,   weight: 1.6, group: [10, 15] },
    dasher:     { hp: 20, speed: 95,  r: 15, dmg: 16, xp: 2, score: 20, color: '#ffe23a', unlock: 16,  weight: 4,
                  windup: 0.6, chargeSpeed: 640, chargeTime: 0.55, rest: 0.9, triggerDist: 360 },
    splitter:   { hp: 32, speed: 85,  r: 18, dmg: 12, xp: 2, score: 25, color: '#44ff77', unlock: 30,  weight: 3 },
    mini:       { hp: 6,  speed: 190, r: 8,  dmg: 6,  xp: 1, score: 5,  color: '#a8ff9d', unlock: 9999, weight: 0 },
    shooter:    { hp: 24, speed: 105, r: 15, dmg: 10, xp: 3, score: 30, color: '#b455ff', unlock: 45,  weight: 3,
                  fireEvery: 2.3, bulletSpeed: 220, keepDist: 330, bulletDmg: 10 },
    orbiter:    { hp: 28, speed: 210, r: 15, dmg: 12, xp: 3, score: 30, color: '#3d7bff', unlock: 62,  weight: 3,
                  startRadius: 420, shrink: 22, minRadius: 50 },
    bomber:     { hp: 38, speed: 118, r: 18, dmg: 28, xp: 4, score: 40, color: '#ff8a1f', unlock: 100, weight: 2.2,
                  fuse: 1.2, blastR: 125, triggerDist: 130 },
    shielded:   { hp: 45, speed: 82,  r: 19, dmg: 15, xp: 5, score: 50, color: '#f2f6ff', unlock: 125, weight: 2,
                  shieldHp: 70, shieldArc: 1.2, turnRate: 1.6 },
    teleporter: { hp: 28, speed: 60,  r: 15, dmg: 10, xp: 5, score: 50, color: '#ff5cd6', unlock: 150, weight: 2,
                  idle: [1.4, 2.4], blinkTime: 0.28, burst: 4, bulletSpeed: 260, bulletDmg: 9, blinkMin: 170, blinkMax: 290 },
  },

  bosses: {
    order: ['spiral', 'ring', 'summoner'],
    hpGrowth: 0.75,                  // +75% hp for every boss already beaten
    xpDrop: 60,
    spiral:   { hp: 1500, speed: 70,  r: 62, dmg: 25, color: '#ff3df2', score: 2500, fireEvery: 0.09, arms: 4, spin: 1.9, bulletSpeed: 210, bulletDmg: 11 },
    ring:     { hp: 1700, speed: 85,  r: 58, dmg: 25, color: '#33f6ff', score: 2800, ringEvery: 2.3, ringCount: 34, gapSize: 5, bulletSpeed: 170, bulletDmg: 12 },
    summoner: { hp: 1600, speed: 110, r: 56, dmg: 25, color: '#ffe23a', score: 3000, summonEvery: 3.4, summonCount: 7, fireEvery: 1.6, bulletSpeed: 240, bulletDmg: 10 },
  },

  enemyBullet: { radius: 7, life: 6 },

  // upgrade caps (max stacks). Effects are in the UPGRADES section.
  caps: {
    multishot: 4, pierce: 3, bounce: 2, rapid: 6, heavy: 6, blades: 5, chain: 3,
    explosive: 3, dash: 3, slowmo: 1, magnet: 4, regen: 4, maxhp: 5, speed: 4,
  },

  slowmo: { threshold: 0.3, duration: 2, scale: 0.35, cooldown: 30 },

  // Adaptive quality: if fps stays below `minFps`, step down one level
  // (lower canvas resolution, fewer particles). Levels never step back up within a session.
  quality: { minFps: 47, dprCap: [2, 1.5, 1], particleMul: [1, 0.7, 0.45] },

  fx: {
    maxParticles: 650,
    maxTexts: 40,
    shakeDecay: 7,
    maxShake: 18,
  },

  music: { baseBpm: 112, maxBpmAdd: 26, bpmPerMin: 6 },
};

/* =====================================================================
   2. UTILITIES
   ===================================================================== */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const pickWeighted = (entries) => {           // entries: [[key, weight], ...]
  let total = 0;
  for (let i = 0; i < entries.length; i++) total += entries[i][1];
  let r = Math.random() * total;
  for (let i = 0; i < entries.length; i++) { r -= entries[i][1]; if (r <= 0) return entries[i][0]; }
  return entries[entries.length - 1][0];
};

/* Pool: a live list plus a free list. Objects are reused, never re-allocated.
   Removal swaps with the last element (O(1)); iterate backwards when removing. */
class Pool {
  constructor(factory, cap) { this.factory = factory; this.cap = cap; this.items = []; this.free = []; }
  get count() { return this.items.length; }
  spawn() {
    if (this.items.length >= this.cap) return null;
    const o = this.free.length ? this.free.pop() : this.factory();
    this.items.push(o);
    return o;
  }
  removeAt(i) {
    const items = this.items, o = items[i], last = items.pop();
    if (i < items.length) items[i] = last;
    this.free.push(o);
  }
  clear() { while (this.items.length) this.free.push(this.items.pop()); }
}

/* Uniform spatial hash grid over the arena for enemy lookups. */
class SpatialGrid {
  constructor(w, h, cell) {
    this.cell = cell;
    this.cols = Math.ceil(w / cell) + 1;
    this.rows = Math.ceil(h / cell) + 1;
    this.cells = [];
    for (let i = 0; i < this.cols * this.rows; i++) this.cells.push([]);
    this.used = [];
  }
  clear() { for (let i = 0; i < this.used.length; i++) this.cells[this.used[i]].length = 0; this.used.length = 0; }
  insert(o) {
    const cx = clamp((o.x / this.cell) | 0, 0, this.cols - 1);
    const cy = clamp((o.y / this.cell) | 0, 0, this.rows - 1);
    const idx = cy * this.cols + cx, c = this.cells[idx];
    if (c.length === 0) this.used.push(idx);
    c.push(o);
  }
  // Fills `out` with objects whose cell overlaps the query circle. Returns out.
  query(x, y, r, out) {
    out.length = 0;
    const c = this.cell;
    const x0 = clamp(((x - r) / c) | 0, 0, this.cols - 1), x1 = clamp(((x + r) / c) | 0, 0, this.cols - 1);
    const y0 = clamp(((y - r) / c) | 0, 0, this.rows - 1), y1 = clamp(((y + r) / c) | 0, 0, this.rows - 1);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        const cell = this.cells[cy * this.cols + cx];
        for (let i = 0; i < cell.length; i++) out.push(cell[i]);
      }
    }
    return out;
  }
}

/* =====================================================================
   3. SETTINGS (kept for this browser session only)
   ===================================================================== */
const Settings = { music: true, sfx: true, vibe: true, best: 0 };
(function loadSettings() {
  try {
    const s = JSON.parse(sessionStorage.getItem('neonSurge') || 'null');
    if (s) Object.assign(Settings, s);
  } catch (e) { /* storage unavailable: ignore */ }
})();
function saveSettings() {
  try { sessionStorage.setItem('neonSurge', JSON.stringify(Settings)); } catch (e) { /* ignore */ }
}

function vibrate(pattern) {
  if (!Settings.vibe) return;
  try { if (typeof navigator.vibrate === 'function') navigator.vibrate(pattern); } catch (e) { /* ignore */ }
}

/* =====================================================================
   4. AUDIO — everything synthesized with the Web Audio API
   ===================================================================== */
const Sound = {
  ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null, delay: null,
  last: Object.create(null),               // throttle timestamps per sound
  music: { on: false, step: 0, next: 0, bpm: CONFIG.music.baseBpm, boss: false, intensity: 0, ducked: false },

  // Must be called from a user gesture (pointerdown / keydown).
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = this.ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 6;
        comp.attack.value = 0.003; comp.release.value = 0.2;
        comp.connect(ctx.destination);
        this.master = ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(comp);
        this.sfxBus = ctx.createGain(); this.sfxBus.gain.value = 0.75; this.sfxBus.connect(this.master);
        this.musicBus = ctx.createGain(); this.musicBus.gain.value = Settings.music ? 0.3 : 0; this.musicBus.connect(this.master);
        // arp echo
        this.delay = ctx.createDelay(1);
        const fb = ctx.createGain(); fb.gain.value = 0.32;
        const wet = ctx.createGain(); wet.gain.value = 0.35;
        this.delay.connect(fb); fb.connect(this.delay); this.delay.connect(wet); wet.connect(this.musicBus);
        // 1s of white noise reused by every noise sound
        const len = ctx.sampleRate;
        this.noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        setInterval(() => this.pump(), 25);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  get ready() { return !!this.ctx && this.ctx.state === 'running'; },
  suspend() { try { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); } catch (e) {} },
  resume() { try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },

  throttle(name, ms) {
    const now = performance.now();
    if (this.last[name] && now - this.last[name] < ms) return false;
    this.last[name] = now; return true;
  },

  // ---- building blocks -------------------------------------------------
  tone(type, f0, f1, dur, vol, opts) {
    const ctx = this.ctx, t = (opts && opts.when) || ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const a = (opts && opts.attack) || 0.004;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect((opts && opts.dest) || this.sfxBus);
    o.start(t); o.stop(t + dur + 0.02);
    return o;
  },
  noise(dur, vol, ftype, f0, f1, opts) {
    const ctx = this.ctx, t = (opts && opts.when) || ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = ftype; f.Q.value = (opts && opts.q) || 1;
    f.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect((opts && opts.dest) || this.sfxBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },

  // ---- sound effects ------------------------------------------------------
  play(name, p) {
    if (!Settings.sfx || !this.ready) return;
    const fx = SFX[name];
    if (fx) { try { fx(this, p || 0); } catch (e) { /* never let audio break the game */ } }
  },

  // ---- music ---------------------------------------------------------------
  startMusic() { this.music.on = true; this.music.step = 0; if (this.ctx) this.music.next = this.ctx.currentTime + 0.06; },
  stopMusic() { this.music.on = false; },
  setMusicVolume() {
    if (!this.ctx) return;
    const v = !Settings.music ? 0 : this.music.ducked ? 0.08 : 0.3;
    this.musicBus.gain.setTargetAtTime(v, this.ctx.currentTime, 0.08);
  },
  duck(on) { this.music.ducked = on; this.setMusicVolume(); },
  pump() {
    const m = this.music, ctx = this.ctx;
    if (!ctx || !m.on || ctx.state !== 'running') return;
    if (m.next < ctx.currentTime - 0.2) m.next = ctx.currentTime + 0.05;   // recovered from a stall
    while (m.next < ctx.currentTime + 0.12) {
      if (Settings.music) { try { Music.step(this, m.step, m.next); } catch (e) {} }
      m.next += 60 / m.bpm / 4;                // 16th notes
      m.step = (m.step + 1) % 64;              // 4 bars
    }
  },
};

const midiHz = (n) => 440 * Math.pow(2, (n - 69) / 12);

const SFX = {
  shoot(S) {
    if (!S.throttle('shoot', 55)) return;
    const f = 980 * rand(0.9, 1.1);
    S.tone('triangle', f, f * 0.35, 0.07, 0.03);
  },
  hit(S) {
    if (!S.throttle('hit', 40)) return;
    S.noise(0.05, 0.07, 'highpass', 2500, 2500);
    S.tone('square', rand(260, 320), 120, 0.05, 0.02);
  },
  shieldBlock(S) {
    if (!S.throttle('block', 60)) return;
    S.tone('square', 1900, 1500, 0.05, 0.03);
  },
  death(S) {
    if (!S.throttle('death', 30)) return;
    const k = rand(0.85, 1.2);
    S.noise(0.16, 0.11, 'bandpass', 1400 * k, 260, { q: 1.5 });
    S.tone('sawtooth', 420 * k, 70, 0.13, 0.045);
  },
  explosion(S) {
    if (!S.throttle('boom', 70)) return;
    S.noise(0.5, 0.32, 'lowpass', 1100, 90);
    S.tone('sine', 130, 38, 0.45, 0.32);
  },
  bomb(S) {
    S.noise(1.1, 0.45, 'lowpass', 3000, 60);
    S.tone('sine', 160, 30, 0.9, 0.45);
    S.tone('sawtooth', 900, 60, 0.6, 0.06);
  },
  xp(S, n) {
    if (!S.throttle('xp', 35)) return;
    const f = 760 * Math.pow(2, Math.min(n, 18) / 24);
    S.tone('sine', f, f * 1.5, 0.07, 0.035);
  },
  pickup(S) {
    const t = S.ctx.currentTime;
    [72, 76, 79, 84].forEach((n, i) => S.tone('triangle', midiHz(n), midiHz(n), 0.14, 0.09, { when: t + i * 0.05 }));
  },
  levelUp(S) {
    const t = S.ctx.currentTime;
    [69, 73, 76, 81, 85].forEach((n, i) => {
      S.tone('triangle', midiHz(n), midiHz(n), 0.35, 0.1, { when: t + i * 0.07 });
      S.tone('sine', midiHz(n + 12), midiHz(n + 12), 0.25, 0.04, { when: t + i * 0.07 });
    });
  },
  select(S) {
    const t = S.ctx.currentTime;
    S.tone('square', 660, 660, 0.06, 0.05, { when: t });
    S.tone('square', 990, 990, 0.12, 0.05, { when: t + 0.06 });
  },
  click(S) { S.tone('square', 520, 780, 0.05, 0.04); },
  playerHit(S) {
    S.tone('sawtooth', 240, 55, 0.28, 0.16);
    S.noise(0.22, 0.2, 'lowpass', 1800, 150);
  },
  dash(S) {
    S.noise(0.2, 0.13, 'bandpass', 350, 2600, { q: 2 });
    S.tone('sine', 300, 700, 0.12, 0.04);
  },
  enemyShoot(S) {
    if (!S.throttle('eshoot', 70)) return;
    S.tone('sine', 520, 260, 0.09, 0.03);
  },
  blink(S) {
    if (!S.throttle('blink', 80)) return;
    S.tone('sine', 1500, 300, 0.12, 0.04);
  },
  fuse(S) {
    if (!S.throttle('fuse', 120)) return;
    S.tone('square', 1200, 1200, 0.05, 0.03);
  },
  bossWarning(S) {
    const t = S.ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      S.tone('sawtooth', 440, 330, 0.45, 0.1, { when: t + i * 0.55, attack: 0.03 });
      S.tone('sawtooth', 443, 333, 0.45, 0.06, { when: t + i * 0.55, attack: 0.03 });
    }
  },
  bossDeath(S) {
    S.noise(1.8, 0.5, 'lowpass', 2500, 50);
    S.tone('sine', 110, 25, 1.6, 0.5);
    const t = S.ctx.currentTime;
    [57, 64, 69, 76].forEach((n, i) => S.tone('triangle', midiHz(n), midiHz(n), 0.5, 0.08, { when: t + 0.3 + i * 0.1 }));
  },
  slowmo(S) { S.tone('sine', 900, 120, 0.8, 0.12, { attack: 0.02 }); },
  gameOver(S) {
    S.tone('sawtooth', 440, 45, 1.4, 0.15, { attack: 0.01 });
    S.tone('square', 220, 30, 1.4, 0.06);
    S.noise(1.2, 0.3, 'lowpass', 1500, 60);
  },
};

/* Synthwave loop: Am - F - C - G, 16th-note grid, 4 bars = 64 steps. */
const Music = {
  roots: [45, 41, 48, 43],                 // A2 F2 C3 G2
  chords: [[0, 3, 7], [0, 4, 7], [0, 4, 7], [0, 4, 7]],
  step(S, step, t) {
    const m = S.music, ctx = S.ctx, bus = S.musicBus;
    const bar = (step >> 4) & 3, s = step & 15;
    const root = this.roots[bar], chord = this.chords[bar];
    const sd = 60 / m.bpm / 4;
    const boss = m.boss, inten = m.intensity;

    // kick on every beat
    if (s % 4 === 0) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.3);
    }
    // hi-hats: off-beat 8ths, all 16ths when intense
    if (s % 4 === 2 || ((boss || inten > 0.5) && s % 2 === 1)) {
      S.noise(0.04, s % 4 === 2 ? 0.16 : 0.07, 'highpass', 7500, 7500, { when: t, dest: bus });
    }
    // snare on 2 and 4 once things heat up
    if ((boss || inten > 0.25) && (s === 4 || s === 12)) {
      S.noise(0.16, 0.22, 'bandpass', 1900, 1200, { when: t, dest: bus, q: 0.8 });
      S.tone('triangle', 190, 140, 0.08, 0.12, { when: t, dest: bus });
    }
    // bass: pulsing 8ths with octave jumps
    if (s % 2 === 0) {
      const n = root - 12 + ((s % 8 === 6) ? 12 : 0);
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.value = midiHz(n);
      f.type = 'lowpass'; f.Q.value = 5;
      f.frequency.setValueAtTime(1300 + inten * 900, t); f.frequency.exponentialRampToValueAtTime(220, t + sd * 1.8);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + sd * 1.9);
      o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + sd * 2);
    }
    // arpeggio: chord tones climbing, every 16th
    {
      const pat = [0, 1, 2, 3, 2, 1, 0, 1];
      const idx = pat[s % 8], oct = idx === 3 ? 12 : 0;
      const n = root + 24 + chord[idx % 3] + oct;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = midiHz(n);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.045, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + sd * 0.9);
      o.connect(g); g.connect(bus); g.connect(S.delay); o.start(t); o.stop(t + sd);
      S.delay.delayTime.setValueAtTime(sd * 3, t);
    }
    // boss layer: detuned saw stabs + pad
    if (boss) {
      if (s % 2 === 0) {
        const n = root + 24 + chord[(s >> 1) % 3];
        for (const det of [-9, 9]) {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sawtooth'; o.frequency.value = midiHz(n); o.detune.value = det;
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.035, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + sd * 1.6);
          o.connect(g); g.connect(bus); o.start(t); o.stop(t + sd * 1.7);
        }
      }
      if (s === 0) S.tone('sawtooth', midiHz(root + 12), midiHz(root + 12), sd * 15, 0.035, { when: t, dest: bus, attack: 0.15 });
    }
  },
};

/* =====================================================================
   5. INPUT — two floating joysticks (Pointer Events, tracked per pointer id),
      keyboard + mouse fallback for laptops.
   ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

const STICK_R = 58;                       // joystick radius in CSS px
const Input = {
  move: { id: null, bx: 0, by: 0, x: 0, y: 0, dx: 0, dy: 0 },
  aim:  { id: null, bx: 0, by: 0, x: 0, y: 0, dx: 0, dy: 0 },
  keys: Object.create(null),
  mouse: { x: 0, y: 0, down: false, seen: false },
  lastLeftDown: -1e9, lastLeftX: 0, lastLeftY: 0,
  dashQueued: false,
  reset() {
    this.move.id = null; this.aim.id = null;
    this.move.dx = this.move.dy = this.aim.dx = this.aim.dy = 0;
    this.mouse.down = false; this.dashQueued = false;
    for (const k in this.keys) this.keys[k] = false;
  },
};

function stickUpdate(s, x, y) {
  let dx = x - s.bx, dy = y - s.by;
  const d = Math.hypot(dx, dy);
  if (d > STICK_R) {                      // drag the base along so the stick never "runs out"
    const k = (d - STICK_R) / d;
    s.bx += dx * k; s.by += dy * k;
    dx = x - s.bx; dy = y - s.by;
  }
  s.x = x; s.y = y;
  s.dx = dx / STICK_R; s.dy = dy / STICK_R;
}

function onPointerDown(e) {
  e.preventDefault();
  Sound.unlock();
  if (Game.state !== 'play') return;
  if (e.pointerType === 'mouse') {
    Input.mouse.seen = true;
    Input.mouse.x = e.clientX; Input.mouse.y = e.clientY;
    if (e.button === 0) Input.mouse.down = true;
    return;
  }
  const x = e.clientX, y = e.clientY;
  if (x < View.cssW * 0.5) {
    if (Input.move.id !== null) return;
    const now = performance.now();
    if (now - Input.lastLeftDown < CONFIG.player.doubleTapMs && Math.hypot(x - Input.lastLeftX, y - Input.lastLeftY) < 140) {
      Input.dashQueued = true;
    }
    Input.lastLeftDown = now; Input.lastLeftX = x; Input.lastLeftY = y;
    const s = Input.move; s.id = e.pointerId; s.bx = s.x = x; s.by = s.y = y; s.dx = s.dy = 0;
  } else {
    if (Input.aim.id !== null) return;
    const s = Input.aim; s.id = e.pointerId; s.bx = s.x = x; s.by = s.y = y; s.dx = s.dy = 0;
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
}
function onPointerMove(e) {
  if (e.pointerType === 'mouse') {
    Input.mouse.seen = true;
    Input.mouse.x = e.clientX; Input.mouse.y = e.clientY;
    return;
  }
  if (e.pointerId === Input.move.id) stickUpdate(Input.move, e.clientX, e.clientY);
  else if (e.pointerId === Input.aim.id) stickUpdate(Input.aim, e.clientX, e.clientY);
}
function onPointerUp(e) {
  if (e.pointerType === 'mouse') { if (e.button === 0 || e.type === 'pointercancel') Input.mouse.down = false; return; }
  if (e.pointerId === Input.move.id) { Input.move.id = null; Input.move.dx = Input.move.dy = 0; }
  if (e.pointerId === Input.aim.id) { Input.aim.id = null; Input.aim.dx = Input.aim.dy = 0; }
}
canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
canvas.addEventListener('pointermove', onPointerMove, { passive: true });
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);
canvas.addEventListener('lostpointercapture', onPointerUp);
window.addEventListener('pointerup', (e) => { if (e.pointerType === 'mouse' && e.button === 0) Input.mouse.down = false; });

// Block browser gestures: scroll, pull-to-refresh, pinch, double-tap zoom, long-press menu.
const block = (e) => { if (e.cancelable) e.preventDefault(); };
document.addEventListener('touchmove', block, { passive: false });
document.addEventListener('touchstart', (e) => { if (e.touches.length > 1 && e.cancelable) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', block, { passive: false });
document.addEventListener('dblclick', block, { passive: false });
document.addEventListener('contextmenu', block);
document.addEventListener('selectstart', block);

window.addEventListener('keydown', (e) => {
  Sound.unlock();
  const c = e.code;
  if (c === 'Space' || c.startsWith('Arrow')) e.preventDefault();
  if (!e.repeat) {
    if ((c === 'Space' || c === 'ShiftLeft' || c === 'ShiftRight') && Game.state === 'play') Input.dashQueued = true;
    if (c === 'KeyP' || c === 'Escape') {
      if (Game.state === 'play') pauseGame(); else if (Game.state === 'pause') resumeGame();
    }
    if ((c === 'Enter' || c === 'Space') && (Game.state === 'start' || (Game.state === 'over' && UI.overReady))) startGame();
    if (Game.state === 'levelup' && /^Digit[123]$/.test(c)) UI.pickCard(+c.slice(5) - 1);
  }
  Input.keys[c] = true;
});
window.addEventListener('keyup', (e) => { Input.keys[e.code] = false; });

// Movement vector in [-1,1]^2 (length <= 1)
function readMove(out) {
  const s = Input.move;
  let x = 0, y = 0;
  if (s.id !== null) { x = s.dx; y = s.dy; }
  else {
    const k = Input.keys;
    if (k.KeyA || k.ArrowLeft) x -= 1;
    if (k.KeyD || k.ArrowRight) x += 1;
    if (k.KeyW || k.ArrowUp) y -= 1;
    if (k.KeyS || k.ArrowDown) y += 1;
  }
  const len = Math.hypot(x, y);
  if (len < 0.12) { out.x = 0; out.y = 0; return out; }
  if (len > 1) { x /= len; y /= len; }
  out.x = x; out.y = y; return out;
}

/* =====================================================================
   6. RENDER SETUP — canvas size, DPR, logical view, glow sprite cache
   ===================================================================== */
const Quality = { level: 0, acc: 0, frames: 0, slow: 0 };
function qualityTick(rdt) {
  if (Game.state !== 'play' || rdt <= 0) { Quality.acc = 0; Quality.frames = 0; return; }
  Quality.acc += rdt; Quality.frames++;
  if (Quality.acc < 2) return;
  const fps = Quality.frames / Quality.acc;
  Quality.acc = 0; Quality.frames = 0;
  if (fps < CONFIG.quality.minFps) {
    if (++Quality.slow >= 2 && Quality.level < CONFIG.quality.dprCap.length - 1) { Quality.level++; Quality.slow = 0; resize(); }
  } else Quality.slow = 0;
}
const View = { cssW: 1, cssH: 1, dpr: 1, scale: 1, worldW: 1, worldH: 1, safe: { l: 0, r: 0, t: 0, b: 0 }, sprScale: 2 };

function resize() {
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  View.cssW = w; View.cssH = h;
  View.dpr = Math.min(window.devicePixelRatio || 1, CONFIG.quality.dprCap[Quality.level]);   // capped: big perf win on 3x phones
  canvas.width = Math.round(w * View.dpr);
  canvas.height = Math.round(h * View.dpr);
  View.scale = Math.max(h / CONFIG.view.height, w / CONFIG.view.maxWidth);
  View.worldW = w / View.scale; View.worldH = h / View.scale;
  try {
    const cs = getComputedStyle(document.getElementById('safeProbe'));
    View.safe.t = parseFloat(cs.paddingTop) || 0; View.safe.r = parseFloat(cs.paddingRight) || 0;
    View.safe.b = parseFloat(cs.paddingBottom) || 0; View.safe.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) { /* ignore */ }
  const ss = clamp(View.scale * View.dpr, 1, 2.5);
  if (Math.abs(ss - View.sprScale) > 0.2 || !Sprites.built) { View.sprScale = ss; buildSprites(); }
  checkOrientation();
}

/* Glow sprites: each shape is pre-rendered once (with shadowBlur) into an
   offscreen canvas, then stamped with drawImage. This keeps the neon look
   while avoiding per-frame shadowBlur, which is very slow on phones. */
const Sprites = { built: false };
function makeSprite(radius, draw, glow) {
  const S = View.sprScale, pad = (glow == null ? 14 : glow) + 4;
  const half = radius + pad;
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(half * 2 * S);
  const g = c.getContext('2d');
  g.scale(S, S); g.translate(half, half);
  g.lineJoin = 'round'; g.lineCap = 'round';
  draw(g, glow == null ? 14 : glow);
  return { c, h: half };
}
function polyPath(g, n, r, rot, squash) {
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + (i / n) * TAU;
    g.lineTo(Math.cos(a) * r, Math.sin(a) * r * (squash || 1));
  }
  g.closePath();
}
function starPath(g, n, r1, r2, rot) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + (i / (n * 2)) * TAU, r = i % 2 ? r2 : r1;
    g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  g.closePath();
}
// Neon stroke: glowing colored outline + faint fill + hot white core line.
function neon(g, color, glow, lw, fillAlpha) {
  g.shadowColor = color; g.shadowBlur = glow;
  g.fillStyle = color; g.globalAlpha = fillAlpha == null ? 0.16 : fillAlpha; g.fill();
  g.globalAlpha = 1; g.strokeStyle = color; g.lineWidth = lw || 3; g.stroke();
  g.shadowBlur = 0; g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = (lw || 3) * 0.35; g.stroke();
}

const SHAPES = {
  chaser:     (g, r, c, gl) => { polyPath(g, 3, r, 0, 1); neon(g, c, gl); },
  dasher:     (g, r, c, gl) => { polyPath(g, 4, r * 1.15, 0, 0.62); neon(g, c, gl); },
  shooter:    (g, r, c, gl) => { g.beginPath(); g.arc(0, 0, r, 0, TAU); neon(g, c, gl); g.beginPath(); g.arc(0, 0, r * 0.4, 0, TAU); neon(g, c, gl, 2, 0.5); },
  splitter:   (g, r, c, gl) => { polyPath(g, 4, r * 1.2, Math.PI / 4); neon(g, c, gl); g.beginPath(); g.moveTo(-r * 0.4, 0); g.lineTo(r * 0.4, 0); g.moveTo(0, -r * 0.4); g.lineTo(0, r * 0.4); neon(g, c, gl, 2); },
  mini:       (g, r, c, gl) => { polyPath(g, 4, r * 1.25, Math.PI / 4); neon(g, c, gl, 2.5, 0.3); },
  orbiter:    (g, r, c, gl) => { g.beginPath(); g.arc(0, 0, r, 0.5, TAU - 0.5); neon(g, c, gl, 3.5, 0); g.beginPath(); g.arc(0, 0, r * 0.45, 0, TAU); neon(g, c, gl, 2, 0.4); },
  bomber:     (g, r, c, gl) => { polyPath(g, 6, r, 0); neon(g, c, gl); polyPath(g, 6, r * 0.45, Math.PI / 6); neon(g, c, gl, 2, 0.5); },
  shielded:   (g, r, c, gl) => { polyPath(g, 5, r, -Math.PI / 2); neon(g, c, gl); },
  teleporter: (g, r, c, gl) => { starPath(g, 5, r * 1.15, r * 0.5, -Math.PI / 2); neon(g, c, gl); },
  swarm:      (g, r, c, gl) => { g.beginPath(); g.arc(0, 0, r, 0, TAU); neon(g, c, gl, 2, 0.7); },
  spiral:     (g, r, c, gl) => {
    starPath(g, 8, r, r * 0.62, 0); neon(g, c, gl, 4);
    polyPath(g, 4, r * 0.45, 0); neon(g, c, gl, 3);
    g.beginPath(); g.arc(0, 0, r * 0.15, 0, TAU); neon(g, '#ffffff', gl, 2, 0.8);
  },
  ring:       (g, r, c, gl) => {
    polyPath(g, 8, r, Math.PI / 8); neon(g, c, gl, 4);
    g.beginPath(); g.arc(0, 0, r * 0.7, 0, TAU); neon(g, c, gl, 3, 0.05);
    g.beginPath(); g.arc(0, 0, r * 0.38, 0, TAU); neon(g, c, gl, 3, 0.3);
  },
  summoner:   (g, r, c, gl) => {
    polyPath(g, 3, r, -Math.PI / 2); neon(g, c, gl, 4, 0.08);
    polyPath(g, 3, r, Math.PI / 2); neon(g, c, gl, 4, 0.08);
    g.beginPath(); g.ellipse(0, 0, r * 0.38, r * 0.2, 0, 0, TAU); neon(g, '#ff3df2', gl, 3, 0.4);
    g.beginPath(); g.arc(0, 0, r * 0.1, 0, TAU); neon(g, '#ffffff', gl, 2, 1);
  },
};

function buildSprites() {
  Sprites.built = true;
  Sprites.enemy = {}; Sprites.enemyWhite = {};
  const defs = Object.assign({}, CONFIG.enemies);
  for (const b of CONFIG.bosses.order) defs[b] = CONFIG.bosses[b];
  for (const k in defs) {
    const d = defs[k], big = d.r > 40;
    const gl = big ? 22 : d.r < 9 ? 8 : 13;
    Sprites.enemy[k] = makeSprite(d.r * 1.25, (g) => SHAPES[k](g, d.r, d.color, gl), gl);
    Sprites.enemyWhite[k] = makeSprite(d.r * 1.25, (g) => SHAPES[k](g, d.r, '#ffffff', gl), gl);
  }
  const P = CONFIG.player;
  Sprites.player = makeSprite(P.radius * 1.4, (g) => {
    g.beginPath(); g.moveTo(P.radius * 1.35, 0); g.lineTo(-P.radius * 0.9, P.radius * 0.85);
    g.lineTo(-P.radius * 0.45, 0); g.lineTo(-P.radius * 0.9, -P.radius * 0.85); g.closePath();
    neon(g, '#33f6ff', 16, 3, 0.25);
  }, 16);
  // Player bullet: bright cyan-white streak (points along +x)
  Sprites.pbullet = makeSprite(14, (g) => {
    g.shadowColor = '#33f6ff'; g.shadowBlur = 10;
    g.strokeStyle = '#33f6ff'; g.lineWidth = 6; g.beginPath(); g.moveTo(-12, 0); g.lineTo(9, 0); g.stroke();
    g.shadowBlur = 0; g.strokeStyle = '#ffffff'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(-9, 0); g.lineTo(9, 0); g.stroke();
  }, 10);
  // Enemy bullet: hot orange/red orb with a ring — round, warm, clearly different
  Sprites.ebullet = makeSprite(CONFIG.enemyBullet.radius + 2, (g) => {
    const r = CONFIG.enemyBullet.radius;
    g.shadowColor = '#ff3a2a'; g.shadowBlur = 12;
    g.fillStyle = '#ff5a2a'; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    g.shadowBlur = 0; g.fillStyle = '#fff4c0'; g.beginPath(); g.arc(0, 0, r * 0.5, 0, TAU); g.fill();
    g.strokeStyle = '#ffd040'; g.lineWidth = 1.5; g.beginPath(); g.arc(0, 0, r + 1.5, 0, TAU); g.stroke();
  }, 12);
  Sprites.orb = makeSprite(6, (g) => { polyPath(g, 4, 6, 0, 1); neon(g, '#5dffb0', 9, 2, 0.6); }, 9);
  Sprites.orbBig = makeSprite(9, (g) => { polyPath(g, 4, 9, 0, 1); neon(g, '#7aa8ff', 12, 2.5, 0.6); }, 12);
  Sprites.blade = makeSprite(16, (g) => {
    g.beginPath(); g.moveTo(16, 0); g.quadraticCurveTo(0, 7, -12, 3); g.lineTo(-12, -3); g.quadraticCurveTo(0, -7, 16, 0);
    neon(g, '#9ffcff', 12, 2.5, 0.5);
  }, 12);
  Sprites.pickup = {
    health: makeSprite(16, (g) => { g.beginPath(); g.arc(0, 0, 15, 0, TAU); neon(g, '#ff4d7a', 14, 2.5, 0.12);
      g.beginPath(); g.rect(-3, -9, 6, 18); g.rect(-9, -3, 18, 6); neon(g, '#ff4d7a', 10, 2, 0.8); }),
    shield: makeSprite(16, (g) => { polyPath(g, 6, 15, -Math.PI / 2); neon(g, '#4dc3ff', 14, 2.5, 0.12);
      g.beginPath(); g.arc(0, 2, 8, Math.PI, 0); g.lineTo(0, 10); g.closePath(); neon(g, '#4dc3ff', 10, 2, 0.6); }),
    bomb: makeSprite(16, (g) => { g.beginPath(); g.arc(0, 0, 15, 0, TAU); neon(g, '#ff8a1f', 14, 2.5, 0.12);
      starPath(g, 8, 10, 4, 0); neon(g, '#ffe23a', 10, 2, 0.7); }),
    magnet: makeSprite(16, (g) => { g.beginPath(); g.arc(0, 0, 15, 0, TAU); neon(g, '#b455ff', 14, 2.5, 0.12);
      g.beginPath(); g.arc(0, -1, 7, Math.PI, 0, true); g.moveTo(-7, -1); g.lineTo(-7, -7); g.moveTo(7, -1); g.lineTo(7, -7);
      g.shadowColor = '#b455ff'; g.shadowBlur = 8; g.strokeStyle = '#e4a8ff'; g.lineWidth = 4; g.stroke(); }),
  };
  Sprites.dots = new Map();               // soft particle dots, one per color
}
function dotSprite(color) {
  let s = Sprites.dots.get(color);
  if (!s) {
    const S = 2, R = 8, c = document.createElement('canvas');
    c.width = c.height = R * 2 * S;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(R * S, R * S, 0, R * S, R * S, R * S);
    grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.25, color); grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(0, 0, c.width, c.height);
    s = { c, h: R };
    Sprites.dots.set(color, s);
  }
  return s;
}

/* =====================================================================

   ===================================================================== */
const Game = {
  state: 'start',            // start | play | pause | levelup | over
  rotatePaused: false,
  time: 0,                   // survival time (s, game time)

  timeScale: 1,

  score: 0, kills: 0,
  combo: 0, comboTimer: 0, mult: 1, bestMult: 1,

  spawnAcc: 0, nextWave: 0, nextBoss: 0, bossWarnTimer: 0, bossIndex: 0, bossesKilled: 0,
  boss: null,
  shake: 0, hitFlash: 0, flash: 0, flashColor: '#ffffff',
  borderColor: '#33f6ff',
  banner: '', bannerTimer: 0,

};

const player = {
  x: 0, y: 0, vx: 0, vy: 0, angle: 0, hp: 100, maxHp: 100,

  // upgrade levels
